<div class="container d-flex justify-content-center align-items-center mt-5 mb-5">
    <div class="card">
        <div class="p-2">
            <div class="d-flex flex-row"><img [src]="profileImage" width="60"/>
                  
                <div class="d-flex flex-column ml-2"> 
                    <span>User Name</span>
                    <select class="form-select form-select-sm mt-2" aria-label=".form-select-sm">
                        <option selected>Project Manager</option>
                        <option value="1">Software Developer</option>
                        <option value="2">Software Tester</option>
                        <option value="3">Software Architect</option>
                    </select> </div>
            </div>
            <div class="mt-4"> <span class="ml-2">Teams he works for</span>
                <div class="mt-2 team-button d-flex justify-content-between px-2"> 
                    <button type="submit" class="btn btn-success graphic">Graphic Design Team</button> 
                    <button type="submit" class="btn btn-success code ml-2"> Coding Team</button> </div>
            </div><br><br>

            <div class="profile-header">
                <div class="title">Title</div>
                <input type="text" class="description" placeholder="Add description.." autocomplete="off">

                <div class="Manager">Manager</div>
                <select>
                    <option selected>Select</option>
                    <option value="1">Ashwini Bhosale</option>
                    <option value="2">Lalita Kshirsagar</option>
                    <option value="3">Kiran doke</option>
                </select>

                <div class="Email">Email</div>
                <input type="text" placeholder="Email" autocomplete="on">

            </div>

            <div class="mt-4"> <span class="ml-2">Assigned Tasks</span>
                <div class="mt-3 team-projects d-flex justify-content-between px-2">
                    <input type="text" id="projects" name="projects">
                    <div>
                        Status of Task
                        <select>
                            <option selected>Select</option>
                            <option value="1">Completed</option>
                            <option value="2">Working</option>
                            <option value="3">Not Started</option>
                            <option value="4">Not Started</option>
                        </select>     
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-4 mb-3"> <span class="ml-3"></span>
            <div class="mt-2 team-button d-flex justify-content-between px-3"> <button class="btn btn-success">Save</button> <button class="btn btn-primary ml-1">Discard</button> </div>
        </div>
    </div>
</div>

<div>
    <p>Back to Home<a routerLink="/home">Home</a></p>
</div>
