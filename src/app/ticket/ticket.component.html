<div class="form-container">
    <form id="ticketForm">
        <label for="ticket_id">Enter Ticket ID:</label>
        <input type="number" id="ticket_id" name="ticket_id" required />

        <label for="priority">Select the Ticket Priority:</label>
        <select id="priority" name="priority">
            <option value="High">High</option>
            <option value="Middle">Middle</option>
            <option value="Low">Low</option>
            <option value="urgent">Urgent</option>
        </select>

        <label for="issue">What is the Issue?</label>
        <textarea id="issue" name="issue" rows="4" required></textarea>

        <label for="assigned_to">Assigned To Whom?</label>
        <input type="text" id="assigned_to" name="assigned_to" required />

        <label for="status">Select Ticket Status:</label>
        <select id="status" name="status">
            <option value="Completed">Completed</option>
            <option value="Working">Working</option>
            <option value="Not Started">Not Started</option>
            <option value="Started">Started</option>
            <option value="pending">Pending</option>
            <option value="Failed">Failed</option>
        </select>

        <button type="submit">Get Ticket</button>
    </form>
</div>

</div>
